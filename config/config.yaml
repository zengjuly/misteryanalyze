# Mystery趋势交易分析系统配置文件

# 同花顺金融数据服务 API Key（docs/082211: 统一入口，ths_client 启动时注入环境变量，
# 所有进程/子进程自动继承；也可用环境变量 HITHINK_FINANCE_API_KEY 覆盖）
hithink_api_key: "sk-fuyao-ujO0_f6hxdCxp3gglWe1rj3MVxPfwf0k"

# 基础配置
# 输出目录：分析结果保存目录（默认 /home/ai/ai_runner/stock/output，该目录为git仓库，每次生成后自动同步远端）
output_dir: "/home/ai/ai_runner/stock/output"
log_level: "INFO"
log_file: "logs/stock_analysis.log"

# 数据库配置
database:
  host: "localhost"
  port: 3306
  username: "root"
  password: ""
  database: "stock_analysis"

# Baostock配置
baostock:
  login: "anonymous"
  password: "123456"
  fields: "date,open,high,low,close,volume,amount,turn,pctChg"
  frequency: "d"
  adjustflag: "3"

# 股票配置
stocks:
  # A股股票代码（已去重，18只）
  - "sh600000"  # 浦发银行
  - "sh600036"  # 招商银行
  - "sh600519"  # 贵州茅台
  - "sz000001"  # 平安银行
  - "sz000002"  # 万科A
  - "sz000858"  # 五粮液
  - "sz002415"  # 海康威视
  - "sz300750"  # 宁德时代
  - "sz300059"  # 东方财富
  - "sh600276"  # 恒瑞医药
  - "sh600887"  # 伊利股份
  - "sh600150"  # 中国船舶 
  - "sz000783"  # 长江证券 
  - "sh601888"  # 中国中免
  - "sh603993"  # 洛阳钼业 
  - "sh600372"  # 中航机载
  - "sh600938"  # 中国海油 
  - "sz300896"  # 爱美客
  
# 行业配置
industries:
  - "银行"
  - "白酒"
  - "医药"
  - "科技"
  - "新能源"
  - "消费"
  - "房地产"
  - "保险"
  - "汽车"
  - "化工"
  - "医疗"
  - "军工"
  - "贵金属"
  - "工业金属"
  - "小金属"
  
# 大盘指数配置
market_indices:
  - "sh000001"  # 上证指数
  - "sz399001"  # 深证成指
  - "sz399006"  # 创业板指
  - "sh000300"  # 沪深300
  - "sz399905"  # 中证500

# 技术指标配置
indicators:
  # 均线系统
  ma_periods: [5, 10, 20, 60, 250]
  ema_periods: [12, 26]
  
  # 趋势指标
  macd_params:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  
  # 动能指标
  rsi_period: 14
  kdj_params:
    k_period: 9
    d_period: 3
    j_period: 3
  
  # 成交量指标
  volume_ma_period: 20
  volume_ratio_period: 5

# Mystery理论配置
mystery:
  # 基础过滤参数
  min_price: 5.0
  max_price: 1000.0
  min_volume: 1000000
  max_turnover_ratio: 0.15
  
  # 三振共振参数
  resonance_threshold: 0.7
  
  # 主升浪参数
  ma5_slope_threshold: 0.01
  ma5_break_threshold: 0.05
  
  # 平台突破参数
  platform_volume_ratio: 1.5
  platform_days_min: 60
  platform_days_max: 250
  
  # 形态识别参数
  head_shoulder_reliability: 0.7
  double_pattern_reliability: 0.75
  triangle_reliability: 0.6

# 输出配置
output:
  # Excel配置
  excel:
    include_summary: true
    include_indicators: true
    include_patterns: true
    include_history: true
    max_history_days: 30
  
  # HTML配置
  html:
    include_charts: true
    include_realtime: true
    auto_refresh: true
    refresh_interval: 30  # 秒
  
  # 报告配置
  reports:
    daily_summary: true
    weekly_summary: true
    monthly_summary: true

# 风险控制配置
risk_control:
  # 止损设置
  stop_loss:
    enabled: true
    percentage: 0.08  # 8%
    max_loss_days: 3
  
  # 仓位控制
  position:
    max_position: 0.2  # 单只股票最大仓位20%
    total_position: 0.8  # 总仓位80%
    
  # 风险预警
  warnings:
    high_risk_score: 30
    low_liquidity_score: 40
    high_volatility_score: 25

# 性能配置
performance:
  # 数据获取
  data_fetch:
    timeout: 30
    retry_times: 3
    retry_delay: 5
  
  # 计算优化
  calculation:
    parallel_processing: true
    batch_size: 50
    cache_enabled: true
    
  # 内存管理
  memory:
    max_memory_usage: 2048  # MB
    cleanup_interval: 3600  # 秒

# 通知配置
notifications:
  # 邮件通知
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: ""
    recipients: []
    
  # 微信通知
  wechat:
    enabled: false
    corp_id: ""
    corp_secret: ""
    agent_id: ""
    
  # 钉钉通知
  dingtalk:
    enabled: false
    webhook: ""

# 定时任务配置
scheduler:
  # 每日分析
  daily_analysis:
    enabled: true
    time: "9:30"  # 交易时间开始
    timezone: "Asia/Shanghai"
    
  # 实时监控
  realtime_monitor:
    enabled: false
    interval: 300  # 5分钟
    
  # 定时报告
  scheduled_reports:
    enabled: false
    daily_time: "15:30"
    weekly_day: 5  # 周五
    monthly_day: 1  # 每月1日

# 通达信本地数据（docs/tdx2.md 本地优先+过期回退）
tdx:
  home_dir: "/mnt/new_tdx"      # TDX_HOME 覆盖；日K(含vipdoc)与板块（2026-08-17 更新）
  vipdoc_dir: "/home/ai/ai_runner/stock/data/tdx_vipdoc"  # TDX_VIPDOC_DIR 覆盖；财务专用(含cw/)
  freshness:
    kline_max_age_days: 1        # 日K末根K线超过N天视为过期→fallback在线源
    block_max_age_days: 3        # 板块数据新鲜度
    financial_max_age_days: 30   # 财务包新鲜度
  enable: true

# 全市场同步配置（docs/step3.md 并发与同步优化）
sync:
  threads:
    ths_official: 1
    tdx_api: 1
    tdx_local: 8      # 本地读取可多线程
    akshare: 4        # 爬虫源限速
    baostock: 1       # baostock全局单socket，必须串行（多线程会解码错误）
  batch_size: 50
  checkpoint_file: "data/sync_checkpoint.json"  # 断点续传文件（中断后跳过已完成）

# 核心分析模块配置（docs/refact1.md §7 三大心法参数）
analysis:
  ma_params:
    short: [5, 10, 20, 60]   # 日线短中期均线
    long: 250                # 年线滤网
    weekly_long: 60          # 周线锚定（60周线）
  break_five:
    recover_days: 2          # 破五反五: 2个交易日内收回
    ma20_slope_lookback: 3   # MA20 斜率对比窗口（日）
  resonance:
    score_threshold: 85      # 真三振阈值
    position_penalty: 15     # 大盘高位惩罚
  position:
    first_entry_pct: 0.1     # 首次建仓仓位比例
    add_position_pct: 0.2    # 加仓比例
    max_total_pct: 0.3       # 最大总仓位比例

# 开发调试配置
debug:
  # 调试模式
  enabled: false
  
  # 详细日志
  verbose: false
  
  # 数据验证
  data_validation: true
  
  # 性能监控
  performance_monitoring: false
  
  # 调试工具
  debug_tools: []

# 数据源配置（双源退避方案: 通达信本地主源 + AKShare + baostock备用源）
data_source:
  # docs/0821.md 多源退避链升级: 🥇同花顺扶摇(ths_official) → 🥈tdx-api容器 → 🥉tdx_local
  # (akshare/baostock 代码完整保留但退出活动链——静默向下兼容)
  primary: "ths_official"        # 第一主源: 同花顺官方扶摇 Financial-API 命令行管道
  fallback: ["tdx_api", "tdx_local"]  # 灾备动态退避链

  # 同花顺官方扶摇 SDK 配置（api_key 走统一环境变量 HITHINK_FINANCE_API_KEY，不入配置）
  ths_config:
    script_path: "/home/ai/ai_runner/stock/Financial-API/python/toolkit/fuyao/scripts/fuyao.py"
    marketdb_dir: "/home/ai/ai_runner/stock/Financial-API/data"  # 本地 MarketDB DuckDB 中枢（docs/0822.md）
    adjust: "forward"            # 统一前复权（fuyao 实际取值: none/forward/backward）

  # Go tdx-api 本地 Docker 容器服务配置
  tdx_api_config:
    api_url: "http://localhost:8080/api"
    timeout: 5

  retry_times: 3               # 每个源最大重试次数
  retry_delay: 2               # 初始退避延迟（秒），指数递增
  prefer_resample: true        # true=强制日K重采样周/月；false=优先原生数据
  adjust: "qfq"                # 复权：qfq前复权 / hfq后复权 / none不复权
  rate_limit_akshare: 0.3      # AKShare 请求间隔（秒）
  timeout: 30                  # 单次请求超时（秒）

  # 通达信本地数据源配置
  tdx:
    vipdoc_dir: "/home/ai/ai_runner/stock/data/tdx_vipdoc"  # 默认绝对路径(仓库外)，可用环境变量TDX_VIPDOC_DIR覆盖
    enable: true               # 是否启用本地源
    auto_download: false       # 是否自动触发下载（建议手动/定时）
    gbbq_file: "/home/ai/ai_runner/stock/data/tdx_vipdoc/cw/gbbq"  # 除权除息文件(可选，无则增量走连续性检查)
    server_host: "119.147.212.81"  # 通达信行情服务器（协议增量补充，本地无数据时）
    server_port: 7709

  # 源健康评分与动态熔断（docs/step2.md 阶段2优化）
  health:
    enable: true               # 是否启用健康评分
    window_size: 10            # 滑动窗口大小（记录最近N次请求）
    fail_threshold: 3          # 连续失败熔断阈值
    recover_seconds: 300       # 熔断恢复时间（秒）
    sort_by_health: false      # true=按健康分动态排序源；false=保持preferred顺序仅剔除熔断源

  # 增量更新（docs/step1.md 阶段1优化）：本地.day文件尾部读取，零网络
  incremental:
    enable: true               # 是否启用增量更新（fetch_daily优先本地增量）
    max_bars_per_request: 800  # 单次最大增量条数（尾部截断）
    gap_threshold: 0.11        # 除权断裂检测阈值（|增量首收/缓存末收-1|>阈值视为除权，回退在线源）

  # 日K重采样升级（docs/step1.md 阶段1优化）：交易日历感知 + 最少K线数过滤
  resample:
    min_bars_weekly: 3         # 周K最少日K根数（不足剔除，最新周期豁免）
    min_bars_monthly: 10       # 月K最少日K根数（不足剔除，最新周期豁免）
    use_trading_calendar: true # 仅保留交易日（日历来自缓存日K日期并集）
    keep_latest_period: true   # 最新周期豁免（进行中的周/月K必须保留）

  # K线保留条数（循环覆盖，控制存储成本）
  kline_limit:
    daily: 2000
    weekly: 500
    monthly: 300
    enable_cleanup: true
    cleanup_after_upsert: true

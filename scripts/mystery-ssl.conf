# Mystery 分析系统 HTTPS 反向代理（docs/ui.md 部署，复用 Nextcloud 证书）
# 安装: sudo cp scripts/mystery-ssl.conf /etc/apache2/sites-available/ && \
#       sudo a2enmod proxy_http && sudo a2ensite mystery-ssl && \
#       sudo systemctl reload apache2
# 访问: https://zz.zzhappyxiaowu.dpdns.org:1888/ 或 https://[IPv6]:1888/
Listen 1888
<VirtualHost *:1888>
    ServerName zz.zzhappyxiaowu.dpdns.org

    SSLEngine on
    SSLCertificateFile   /etc/ssl/certs/nextcloud.crt
    SSLCertificateKeyFile /etc/ssl/private/nextcloud.key

    # WebSocket（streamlit 实时通信）
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:18881/$1 [P,L]

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:18881/
    ProxyPassReverse / http://127.0.0.1:18881/

    ErrorLog ${APACHE_LOG_DIR}/mystery-error.log
    CustomLog ${APACHE_LOG_DIR}/mystery-access.log combined
</VirtualHost>

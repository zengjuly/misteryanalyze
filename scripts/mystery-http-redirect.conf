# Mystery 分析系统 HTTP→HTTPS 重定向（兼容旧 http 访问习惯）
# http://域名:18880/ → https://域名:1888/ 自动跳转
Listen 18880
<VirtualHost *:18880>
    ServerName zz.zzhappyxiaowu.dpdns.org
    Redirect 308 / https://zz.zzhappyxiaowu.dpdns.org:1888/
    ErrorLog ${APACHE_LOG_DIR}/mystery-http-error.log
    CustomLog ${APACHE_LOG_DIR}/mystery-http-access.log combined
</VirtualHost>
